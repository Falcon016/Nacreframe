<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Nacreframe</title>
  <desc id="d">Nacreframe wordmark with an iridescent pearl diamond on a deep ink background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151f"/>
      <stop offset="1" stop-color="#0e0d13"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d6df"/>
      <stop offset="0.38" stop-color="#b4a7e8"/>
      <stop offset="0.7" stop-color="#8fd3c8"/>
      <stop offset="1" stop-color="#e6c384"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#b4a7e8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b4a7e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#2a2735"/>

  <g transform="translate(150 180)">
    <path d="M0 -92 L80 0 L0 92 L-80 0 Z" fill="url(#pearl)"/>
    <path d="M0 -92 L80 0 L0 92 L-80 0 Z" fill="none" stroke="#f3d6df" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M0 -92 L0 92 M-80 0 L80 0" stroke="#0e0d13" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <text x="290" y="200" font-family="'Newsreader', 'Source Serif 4', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif"
        font-size="112" font-weight="500" fill="#e9e4da" letter-spacing="-1.5">Nacreframe</text>
  <text x="294" y="256" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="26" fill="#9a95a8" letter-spacing="0.4">an agent harness for the terminal</text>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <text x="294" y="306" fill="#e3b7c4">sandbox</text>
    <text x="396" y="306" fill="#5f5a70">·</text>
    <text x="420" y="306" fill="#8fd3c8">approvals</text>
    <text x="540" y="306" fill="#5f5a70">·</text>
    <text x="564" y="306" fill="#b4a7e8">live browser</text>
    <text x="704" y="306" fill="#5f5a70">·</text>
    <text x="728" y="306" fill="#e6c384">agent swarms</text>
  </g>
</svg>
